name: boards CI

on:
  push:
    branches: [board-agents, main]
    paths: ["boards/**", ".github/workflows/boards-ci.yml"]
  pull_request:
    paths: ["boards/**", ".github/workflows/boards-ci.yml"]
  workflow_dispatch:

concurrency:
  group: boards-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: boards

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: boards/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: boards/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: boards/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: boards/pnpm-lock.yaml
      # CI does not run docker build: a package missing in a Dockerfile stage fails only at deploy (TB-234).
      # Dockerfile.kaneo is the prod image; apps/api and apps/web Dockerfiles build the local stack (TB-235).
      - name: Dockerfile stages copy each workspace package their app needs
        run: |
          rc=0
          for f in Dockerfile.kaneo apps/api/Dockerfile apps/web/Dockerfile; do
            node deploy/check-dockerfile-deps.mjs . "$f" || rc=1
          done
          exit "$rc"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The image runs dist under plain Node: an extensionless relative import crash-loops the API (TB-143, TB-173).
      - name: dist loads as ESM under plain Node
        run: node deploy/check-dist-esm.mjs

  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: boards/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: boards/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:check

  api-integration:
    # Routing, authorization, PostgreSQL and migrations end to end (tests/api-integration); the 4 felling tests that
    # were red for weeks would have been seen here (roadmap E3).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaneo
          POSTGRES_PASSWORD: kaneo-ci-only # checks: allow-secret
          POSTGRES_DB: kaneo_test
        # Not 5432/5433: tests/api-integration/setup.ts refuses the ports of live databases (TB-145).
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaneo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kaneo:kaneo-ci-only@localhost:55432/kaneo_test # checks: allow-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: boards/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaneo/api test:integration
