# t-boards on the VPS, scheme A: reachable only through WireGuard.
# Lives in /opt/t-boards; install.sh writes .env (image, Let's Encrypt volume,
# mirror IDs) and secrets/. Run as: docker compose -p t-boards up -d
# The project name is passed explicitly so a stray local run cannot join the
# Mac dev stack, which is also called t-boards.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: t_boards
      POSTGRES_USER: t_boards
      POSTGRES_PASSWORD_FILE: /run/tb-secrets/postgres_password
    volumes:
      - pg:/var/lib/postgresql/data
      - ./secrets/postgres_password:/run/tb-secrets/postgres_password:ro
    mem_limit: 256m
    networks: [tb]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t_boards -d t_boards"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${TB_IMAGE:?TB_IMAGE is not set}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KANEO_CLIENT_URL: https://${TB_DOMAIN:?TB_DOMAIN is not set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: t_boards
      POSTGRES_USER: t_boards
      # Secrets come from files only (N-007).
      POSTGRES_PASSWORD_FILE: /run/tb-secrets/postgres_password
      AUTH_SECRET_FILE: /run/tb-secrets/auth_secret
      # One seeded admin; agents use API keys. Nobody signs up from the tunnel.
      DISABLE_REGISTRATION: "true"
      DISABLE_GUEST_ACCESS: "true"
      NODE_OPTIONS: --max-old-space-size=512
      # The mirror stays off until the workspace and databases are set; the
      # token file is read on every run, so adding it needs no restart.
      NOTION_MIRROR_WORKSPACE_ID: ${NOTION_MIRROR_WORKSPACE_ID:-}
      NOTION_MIRROR_DATABASES: ${NOTION_MIRROR_DATABASES:-}
      NOTION_MIRROR_PRODUCT: ${NOTION_MIRROR_PRODUCT:-}
      NOTION_MIRROR_TOKEN_FILE: /run/tb-secrets/notion_token
      # The notebook writes answers only with a model and its key file; without
      # them it returns the sources it found. The key is read on every call.
      NOTEBOOK_LLM_BASE_URL: ${NOTEBOOK_LLM_BASE_URL:-}
      NOTEBOOK_LLM_MODEL: ${NOTEBOOK_LLM_MODEL:-}
      NOTEBOOK_LLM_DAILY_MAX: ${NOTEBOOK_LLM_DAILY_MAX:-}
      NOTEBOOK_LLM_THINKING: ${NOTEBOOK_LLM_THINKING:-}
      NOTEBOOK_LLM_KEY_FILE: /run/tb-secrets/notebook_llm_key
      # Seals the model key an instance admin saves in the settings (TB-67).
      # install.sh creates it; read once at start, 32+ characters.
      SETTINGS_ENCRYPTION_KEY_FILE: /run/tb-secrets/settings_key
      # claude-mem of the owner's Mac, GET only, through the tunnel's read-only
      # proxy (R-040, d-tb-claude-mem). While the Mac sleeps cards show the
      # reader's last copy.
      CLAUDE_MEM_WORKER_HOST: ${CLAUDE_MEM_WORKER_HOST:-}
      CLAUDE_MEM_WORKER_PORT: ${CLAUDE_MEM_WORKER_PORT:-}
      # The proxy's token (OPS-19), made on the Mac and delivered by
      # mac/memory-token-push.sh. Read on every request; without the file the
      # reader sends no header, which only the proxy's rollout mode accepts.
      CLAUDE_MEM_PROXY_TOKEN_FILE: /run/tb-secrets/claude_mem_proxy_token
      # The owner queue (TB-102): requests go there as items and «да» there
      # is applied here. Off until the URL, the token's name in the queue and
      # the workspace → product pairs are set; the token file is read on
      # every call, so a rotation needs no restart.
      OQ_URL: ${OQ_URL:-}
      OQ_TOKEN_NAME: ${OQ_TOKEN_NAME:-}
      OQ_WORKSPACE_PRODUCTS: ${OQ_WORKSPACE_PRODUCTS:-}
      OQ_TOKEN_FILE: /run/tb-secrets/oq_token
    volumes:
      - ./secrets:/run/tb-secrets:ro
    ports:
      - "127.0.0.1:5180:5173"
    # Until the K-6 measurements (R-005) say otherwise.
    mem_limit: 1g
    networks:
      tb:
        ipv4_address: 10.78.0.2
    restart: unless-stopped

  tls:
    image: nginx:1.27-alpine
    # Binds the WireGuard address only; the edge nginx of the product owns
    # 0.0.0.0:443. Restarts until wg0 is up.
    network_mode: host
    # In the host's network a raw socket could read the memory proxy token off
    # wg0 (plain HTTP inside the tunnel, OPS-19). nginx only needs TCP.
    cap_drop: [NET_RAW]
    depends_on:
      - app
    # Re-read certificates the shared certbot sidecar renews.
    command:
      - sh
      - -c
      - "while sleep 43200; do nginx -s reload; done & exec nginx -g 'daemon off;'"
    volumes:
      - ./tls.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    mem_limit: 64m
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    # uid 70 is postgres in the alpine image and owns the password file.
    user: "70:70"
    # The app migrates before it reports healthy, so the first dump already
    # holds the schema instead of an empty database.
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/tb-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: t_boards
      PGDATABASE: t_boards
      TB_BACKUP_EVERY: "7200"
      TB_BACKUP_KEEP_DAYS: "3"
    volumes:
      - ./backup.sh:/usr/local/bin/tb-backup.sh:ro
      - ./secrets/postgres_password:/run/tb-secrets/postgres_password:ro
      - ./backups:/backups
    mem_limit: 128m
    networks: [tb]
    restart: unless-stopped

# The tunnel firewall lets only the app open connections to the Mac's
# claude-mem proxy (wg-setup.sh, OPS-19): it matches this bridge and the app's
# address, so both are fixed here. Others get addresses from ip_range, never
# the app's. A new network rather than a changed default: Docker cannot change
# a live network, and compose recreates the containers on a new one.
networks:
  tb:
    driver_opts:
      com.docker.network.bridge.name: br-tboards
    ipam:
      config:
        - subnet: 10.78.0.0/28
          ip_range: 10.78.0.8/29
          gateway: 10.78.0.1

volumes:
  pg:
  # The product's certbot volume: its sidecar already renews every
  # certificate in it, ours included.
  letsencrypt:
    external: true
    name: ${TB_LE_VOLUME:?TB_LE_VOLUME is not set}
